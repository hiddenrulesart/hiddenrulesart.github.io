<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Next: three bodies</title></head>
<body>
<script src="../../../lib/scene.js"></script>
<script src="../../../pieces/three-body/sim.js"></script>
<script>
// Scene 9: teaser for episode 4. The Pythagorean three-body problem (Burrau, 1913): masses 3, 4, 5
// at rest on a 3-4-5 triangle. They tangle for a while, then one body is flung away (around t = 35)
// and the other two leave as a pair. Simulation time is scaled so the ejection lands on flingAt.
// Cues: flingAt, nextAt, duration.
Scene.run(({ ctx, W, H, S, num }) => {
  const duration = num('duration', 22), flingAt = num('flingAt', 11), nextAt = num('nextAt', 18);
  const { smooth, text } = Scene;
  const EJECT = 35, rate = EJECT / flingAt;   // simulation time units per second
  const sim = ThreeBodySim.createSim(); sim.eps = 0;
  for (const [x, y, vx, vy, m] of [[1, 3, 0, 0, 3], [-2, -1, 0, 0, 4], [1, -1, 0, 0, 5]]) sim.add(x, y, vx, vy, m);
  sim.center();
  const COL = ['#ffcf6a', '#b59cff', '#7fd8ff'];
  const scale = S * 0.11, ox = W / 2, oy = H / 2;
  const P = (i) => [ox + sim.x[i] * scale, oy - sim.y[i] * scale];
  const trail = document.createElement('canvas'); trail.width = W; trail.height = H;
  const tg = trail.getContext('2d'); tg.lineCap = 'round';
  let prev = [0, 1, 2].map(P);
  sim.onSub = () => {   // draw every integrator substep, so fast close passes stay smooth curves
    const now = [0, 1, 2].map(P);
    for (let i = 0; i < 3; i++) {
      if (Math.hypot(now[i][0] - prev[i][0], now[i][1] - prev[i][1]) < 1.5) continue;
      tg.strokeStyle = COL[i]; tg.lineWidth = S * 0.0035; tg.globalAlpha = 0.9;
      tg.beginPath(); tg.moveTo(prev[i][0], prev[i][1]); tg.lineTo(now[i][0], now[i][1]); tg.stroke();
      prev[i] = now[i];
    }
  };

  return {
    duration,
    frame(t, dt) {
      if (t > 0.3) sim.step(rate * dt);
      // fade the trails slowly
      tg.globalAlpha = 1; tg.globalCompositeOperation = 'destination-out'; tg.fillStyle = 'rgba(0,0,0,0.035)'; tg.fillRect(0, 0, W, H);
      tg.globalCompositeOperation = 'source-over';
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      ctx.fillStyle = '#05050a'; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = smooth(t / 0.6); ctx.drawImage(trail, 0, 0);
      for (let i = 0; i < 3; i++) {
        const [x, y] = P(i), r = S * 0.008 * Math.sqrt(sim.m[i]);
        const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
        g.addColorStop(0, COL[i]); g.addColorStop(0.25, COL[i] + 'aa'); g.addColorStop(1, COL[i] + '00');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, 7); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r * 0.8, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
      // next-episode card
      const k = smooth((t - nextAt) / 1);
      if (k > 0) { ctx.fillStyle = `rgba(5,5,10,${0.6 * k})`; ctx.fillRect(0, 0, W, H); }
      text(ctx, 'NEXT EPISODE', W / 2, H * 0.42, { size: S * 0.026, weight: 600, alpha: k * 0.65, tracking: S * 0.004 });
      text(ctx, 'The Three-Body Problem', W / 2, H * 0.42 + S * 0.075, { size: S * 0.07, weight: 700, alpha: k, shadow: true });
    },
  };
});
</script>
</body></html>

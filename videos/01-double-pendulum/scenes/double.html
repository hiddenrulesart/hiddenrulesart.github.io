<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Second arm</title></head>
<body>
<script src="../../../lib/scene.js"></script>
<script src="../../../pieces/double-pendulum/sim.js"></script>
<script>
// Scene 4: a second arm fades in on a gently swinging pendulum; at liftAt it's lifted high,
// released at liftAt + LIFT, and the tip draws a never-repeating scribble.
Scene.run(({ ctx, W, H, S, num, fps }) => {
  const duration = num('duration', 25), liftAt = num('liftAt', 6), LIFT = 1.0;
  const target = [num('a1', 135) * Math.PI / 180, num('a2', 170) * Math.PI / 180];
  const sim = DoublePendulumSim.createSim({ n: 1 });
  sim.reset(14, 22, 0);
  const ox = W / 2, oy = H * 0.47, L = S * 0.22, lw = Math.max(1.5, S / 520);
  const trace = [];   // tip positions after release
  let released = false, from = null;

  const pos = (a, b) => {
    const x1 = ox + L * Math.sin(a), y1 = oy + L * Math.cos(a);
    return [x1, y1, x1 + L * Math.sin(b), y1 + L * Math.cos(b)];
  };

  return {
    duration,
    frame(t, dt) {
      let a, b;
      if (t < liftAt) { sim.step(dt, 8); a = sim.th1[0]; b = sim.th2[0]; }
      else if (t < liftAt + LIFT) {            // a hand lifts it into position
        if (!from) from = [sim.th1[0], sim.th2[0]];
        const k = Scene.smooth((t - liftAt) / LIFT);
        a = from[0] + (target[0] - from[0]) * k; b = from[1] + (target[1] - from[1]) * k;
      } else {
        if (!released) { released = true; sim.reset(target[0] * 180 / Math.PI, target[1] * 180 / Math.PI, 0); }
        sim.step(dt, 8); a = sim.th1[0]; b = sim.th2[0];
        const p = pos(a, b); trace.push(p[2], p[3]);
      }

      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#05050a'; ctx.fillRect(0, 0, W, H);
      const fadeIn = Scene.smooth(t / 0.6);

      // the scribble: colour shifts along the path, older parts dimmer
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const m = trace.length / 2, CH = 20;
      for (let s = 0; s < m - 1; s += CH) {
        const e = Math.min(m - 1, s + CH);
        const age = (m - e) / fps;                         // seconds since this chunk was drawn
        ctx.strokeStyle = `hsla(${(200 + s / fps * 14) % 360},95%,62%,${0.25 + 0.75 * Math.exp(-age / 6)})`;
        ctx.beginPath(); ctx.moveTo(trace[2 * s], trace[2 * s + 1]);
        for (let i = s + 1; i <= e; i++) ctx.lineTo(trace[2 * i], trace[2 * i + 1]);
        ctx.stroke();
      }

      // the pendulum
      ctx.globalCompositeOperation = 'source-over';
      const [x1, y1, x2, y2] = pos(a, b);
      ctx.lineWidth = lw * 1.6;
      ctx.strokeStyle = `rgba(255,255,255,${0.85 * fadeIn})`;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(x1, y1); ctx.stroke();
      const arm2 = Scene.smooth((t - 0.6) / 1.2) * fadeIn;   // the new arm fades in
      ctx.strokeStyle = `rgba(255,255,255,${0.85 * arm2})`;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${fadeIn})`;
      ctx.beginPath(); ctx.arc(ox, oy, lw * 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x1, y1, S * 0.012, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `hsla(265,95%,70%,${arm2})`;
      ctx.beginPath(); ctx.arc(x2, y2, S * 0.016, 0, Math.PI * 2); ctx.fill();
    },
  };
});
</script>
</body></html>

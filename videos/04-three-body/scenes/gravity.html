<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Newton's gravity</title></head>
<body>
<script src="../../../lib/scene.js"></script>
<script src="../../../pieces/three-body/sim.js"></script>
<script src="sky.js"></script>
<script>
// Newton's law and the two-body ellipse. Phase 1: two bodies with their pull drawn as arrows; the
// distance doubles (dblAt) and the arrows shrink to a quarter. Phase 2 (eqAt, e1..e4): F = G·m₁·m₂/r²
// with each term labelled in words. Phase 3 (ellAt): a light planet on an ellipse (e = 0.5) around a star,
// the trail drawn over itself orbit after orbit, with an orbit counter. Phase 4 (threeAt): a third star of
// similar mass arrives and the ellipse is lost.
Scene.run(({ ctx, W, H, S, num }) => {
  const duration = num('duration', 60), dblAt = num('dblAt', 9), eqAt = num('eqAt', 14),
    e1 = num('e1', 15), e2 = num('e2', 16.5), e3 = num('e3', 18), e4 = num('e4', 20),
    ellAt = num('ellAt', 24), threeAt = num('threeAt', 46), credAt = num('credAt', 2);
  const { smooth, text } = Scene;
  const SERIF = '"Times New Roman", Georgia, serif', MONO = 'ui-monospace, Menlo, monospace';
  const GOLD = Sky.COL[0], CYAN = Sky.COL[2], VIOLET = Sky.COL[1];

  // the two-body orbit: star (mass 1) and planet (0.04), starting at perihelion, eccentricity 0.5
  const M = 1.04, rp = 0.6, e = 0.5;   // semi-major axis rp / (1 − e) = 1.2
  const vp = Math.sqrt(M * (1 + e) / rp);
  const sim = Sky.system([[0, 0, 0, 0, 1], [rp, 0, 0, vp, 0.04]]);
  const period = 2 * Math.PI * Math.sqrt(1.2 ** 3 / M), RATE = 1.6;
  const tr = Sky.trails(sim, 1e9);
  const cam = { x: -0.4, y: 0, s: H * 0.3 };
  let third = false, orbitsAt = 0;

  return {
    duration,
    frame(t, dt) {
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      ctx.fillStyle = '#05050a'; ctx.fillRect(0, 0, W, H);
      const p12 = 1 - smooth((t - ellAt + 0.8) / 0.8);   // phases 1–2 fade out as the orbit begins

      if (p12 > 0) {
        // two bodies and their pull
        const d0 = S * 0.32, grow = smooth((t - dblAt) / 1.4), d = d0 * (1 + grow), cy = H * 0.3 - smooth((t - eqAt) / 1) * H * 0.06;
        const ax = W / 2 - d / 2 - S * 0.0, bx = W / 2 + d / 2;
        const pull = 1 / (1 + grow) ** 2, L = S * 0.14 * pull;
        const a1 = p12 * smooth(t / 0.8);
        ctx.globalAlpha = a1;
        ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 7]);
        ctx.beginPath(); ctx.moveTo(ax, cy + S * 0.075); ctx.lineTo(bx, cy + S * 0.075); ctx.stroke(); ctx.setLineDash([]);
        ctx.globalAlpha = 1;
        text(ctx, 'distance', W / 2, cy + S * 0.105, { size: S * 0.024, weight: 400, alpha: 0.6 * a1 });
        Sky.arrow(ctx, ax + S * 0.04, cy, L, 0, GOLD, S * 0.006, a1);
        Sky.arrow(ctx, bx - S * 0.035, cy, -L, 0, CYAN, S * 0.006, a1);
        for (const [x, c, r] of [[ax, GOLD, S * 0.028], [bx, CYAN, S * 0.022]]) {
          const g = ctx.createRadialGradient(x, cy, 0, x, cy, r * 2.2);
          g.addColorStop(0, c); g.addColorStop(0.45, c + 'cc'); g.addColorStop(1, c + '00');
          ctx.globalAlpha = a1; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, cy, r * 2.2, 0, 7); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, cy, r * 0.55, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
        }
        const da = a1 * smooth((t - dblAt - 1) / 0.6);
        text(ctx, 'twice as far:  one quarter of the pull', W / 2, cy - S * 0.1, { size: S * 0.03, weight: 500, alpha: da });
        text(ctx, 'Isaac Newton, Principia, 1687', W / 2, H * 0.08, { size: S * 0.028, weight: 500, alpha: 0.75 * a1 * smooth((t - credAt) / 0.8) * (1 - smooth((t - eqAt) / 0.6)) });

        // the equation, each term labelled
        if (t > eqAt - 0.2) {
          const al = k => p12 * smooth((t - k) / 0.5), size = S * 0.085, y = H * 0.6;
          ctx.save(); ctx.font = `400 ${Math.round(size)}px ${SERIF}`;
          const wF = ctx.measureText('F').width, wEq = ctx.measureText('=').width, wG = ctx.measureText('G').width,
            wDot = ctx.measureText('·').width, wNum = ctx.measureText('m · m').width + 2 * ctx.measureText('1').width * 0.55 + size * 0.1, wDen = ctx.measureText('r²').width; ctx.restore();
          const gap = size * 0.85, wFrac = wNum + size * 0.2, total = wF + wEq + wG + wDot + wFrac + gap * 4;
          let x = W / 2 - total / 2; const mids = {};
          const put = (s, w, k, color, key) => { text(ctx, s, x, y, { size, weight: 400, font: SERIF, align: 'left', alpha: al(k), color }); mids[key] = x + w / 2; x += w + gap; };
          put('F', wF, e1, '#ffffff', 'F'); put('=', wEq, e1, '#ffffff', 'eq'); put('G', wG, e2, '#ffcf6a', 'G'); put('·', wDot, e3, '#ffffff', 'dot');
          const fx = x, fc = fx + wFrac / 2;
          {   // m₁ · m₂ with hand-drawn subscripts (the serif face has no subscript digits)
            const parts = [['m', 1], ['1', 0.55], [' · ', 1], ['m', 1], ['2', 0.55]];
            ctx.save(); const ws = parts.map(([q, k]) => { ctx.font = `400 ${Math.round(size * k)}px ${SERIF}`; return ctx.measureText(q).width; }); ctx.restore();
            let px = fc - ws.reduce((a, b) => a + b, 0) / 2;
            parts.forEach(([q, k], i) => { text(ctx, q, px, y - size * 0.55 + (k < 1 ? size * 0.2 : 0), { size: size * k, weight: 400, font: SERIF, align: 'left', alpha: al(e3), color: '#7fd8ff' }); px += ws[i]; });
          }
          ctx.globalAlpha = al(e3); ctx.fillStyle = '#fff'; ctx.fillRect(fx, y - size * 0.02, wFrac, Math.max(2, size * 0.04)); ctx.globalAlpha = 1;
          text(ctx, 'r²', fc, y + size * 0.6, { size, weight: 400, font: SERIF, alpha: al(e4), color: '#ff9a7a' });
          const LBL = [['F', 'the pull', 'between them', '#ffffff', e1, 0], ['G', 'a fixed number:', "gravity's strength", '#ffcf6a', e2, 0],
            ['frac', 'the two masses', '', '#7fd8ff', e3, -1], ['frac', 'the distance between', 'them, squared', '#ff9a7a', e4, 1]];
          for (const [k, l1, l2, color, cue, pos] of LBL) {
            const lx = mids[k];
            const la = al(cue) * 0.85;
            if (pos !== 0) {   // the fraction's labels sit to its right, level with the numerator / denominator
              const yy = pos < 0 ? y - size * 0.55 : y + size * 0.6;
              text(ctx, l1, fx + wFrac + size * 0.5, yy - (l2 ? S * 0.018 : 0), { size: S * 0.026, weight: 400, align: 'left', color, alpha: la });
              if (l2) text(ctx, l2, fx + wFrac + size * 0.5, yy + S * 0.018, { size: S * 0.026, weight: 400, align: 'left', color, alpha: la });
            } else {
              text(ctx, l1, lx, y + size * 1.0, { size: S * 0.026, weight: 400, color, alpha: la });
              text(ctx, l2, lx, y + size * 1.0 + S * 0.035, { size: S * 0.026, weight: 400, color, alpha: la });
            }
          }
        }
      }

      // the orbit
      if (t > ellAt - 0.8) {
        const oa = smooth((t - ellAt + 0.8) / 0.8);
        if (t > ellAt) sim.step(RATE * dt);
        if (!third && t >= threeAt) {
          third = true; tr.life = 6;
          // a third star of similar mass, falling in from the upper right
          sim.add(2.1, 1.3, -0.35, -0.25, 0.8);
        }
        if (third) { tr.prune(); Sky.follow(cam, sim, W, H, dt, { minR: 1.6, margin: 1.25, rate: 0.8 }); }
        const rad = (i, m) => S * (i === 0 ? 0.016 : i === 1 ? 0.007 : 0.014);
        Sky.drawTrails(ctx, sim, tr, cam, W, H, S, { alpha: oa });
        Sky.drawBodies(ctx, sim, cam, W, H, S, { alpha: oa, rad });
        const orbits = Math.max(0, Math.floor((sim.time) / period));
        const ca = oa * (1 - smooth((t - threeAt) / 0.6));
        text(ctx, 'two bodies', W * 0.06, H * 0.08, { size: S * 0.03, weight: 600, align: 'left', alpha: ca * 0.85 });
        if (orbits >= 1) text(ctx, `orbit ${orbits + 1}: the same ellipse`, W * 0.06, H * 0.08 + S * 0.05, { size: S * 0.026, weight: 400, align: 'left', alpha: ca * 0.7, font: MONO });
        text(ctx, 'three bodies', W * 0.06, H * 0.08, { size: S * 0.03, weight: 600, align: 'left', alpha: smooth((t - threeAt - 0.4) / 0.6) * 0.85 });
      }
    },
  };
});
</script>
</body></html>

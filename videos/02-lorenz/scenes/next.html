<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Next: the logistic map</title></head>
<body>
<script src="../../../lib/scene.js"></script>
<script>
// Scene 10: teaser for episode 3. Rabbit population over the years as r rises: settles, then
// bounces between 2, 4 values, then chaos; then the bifurcation diagram sweeps in; next-episode card.
// Cues: splitAt (r starts rising), diagramAt, nextAt, duration.
Scene.run(({ ctx, W, H, S, num }) => {
  const duration = num('duration', 20), splitAt = num('splitAt', 4), diagramAt = num('diagramAt', 8), nextAt = num('nextAt', 14);
  const { smooth, text } = Scene;
  const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
  o.fillStyle = '#000'; o.fillRect(0, 0, W, H);
  const R0 = 2.5, R1 = 4, cols = Math.round(W * 0.84), dx0 = W * 0.08, dy0 = H * 0.2, dh = H * 0.62;
  let drawn = 0;

  return {
    duration,
    frame(t) {
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      ctx.fillStyle = '#05050a'; ctx.fillRect(0, 0, W, H);
      const da = smooth((t - diagramAt) / 1.2);

      // population over time for the current r
      const r = 2.8 + 0.9 * smooth((t - splitAt) / Math.max(0.5, diagramAt - splitAt));
      const ga = 1 - da;
      if (ga > 0) {
        const x0 = W * 0.1, x1 = W * 0.9, y0 = H * 0.25, y1 = H * 0.8, n = 48;
        let x = 0.2; for (let i = 0; i < 300; i++) x = r * x * (1 - x);   // let it settle
        const pts = []; for (let i = 0; i < n; i++) { pts.push(x); x = r * x * (1 - x); }
        ctx.globalAlpha = ga; ctx.strokeStyle = '#9f8cff'; ctx.lineWidth = S * 0.004; ctx.lineJoin = 'round';
        ctx.beginPath(); pts.forEach((p, i) => { const px = x0 + (x1 - x0) * i / (n - 1), py = y1 - (y1 - y0) * p; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.stroke();
        ctx.fillStyle = '#e8e2ff';
        pts.forEach((p, i) => { ctx.beginPath(); ctx.arc(x0 + (x1 - x0) * i / (n - 1), y1 - (y1 - y0) * p, S * 0.005, 0, 7); ctx.fill(); });
        ctx.globalAlpha = 1;
        text(ctx, 'rabbits', x0 - S * 0.02, y0 - S * 0.03, { size: S * 0.026, weight: 500, align: 'left', alpha: ga * 0.6 });
        text(ctx, 'years →', x1, y1 + S * 0.05, { size: S * 0.026, weight: 400, align: 'right', alpha: ga * 0.5 });
        text(ctx, `growth rate r = ${r.toFixed(2)}`, W / 2, H * 0.12, { size: S * 0.04, weight: 600, font: 'ui-monospace, Menlo, monospace', alpha: ga * smooth(t / 0.6) });
      }

      // bifurcation diagram, swept in left to right
      if (t >= diagramAt) {
        const target = Math.min(cols, Math.floor(cols * (t - diagramAt) / 3.5));
        o.globalCompositeOperation = 'lighter';
        for (; drawn < target; drawn++) {
          const rr = R0 + (R1 - R0) * drawn / cols; let x = 0.5;
          for (let i = 0; i < 400; i++) x = rr * x * (1 - x);
          o.fillStyle = `hsla(${250 - 60 * (drawn / cols)},90%,70%,0.16)`;
          for (let i = 0; i < 260; i++) { x = rr * x * (1 - x); o.fillRect(dx0 + drawn, dy0 + dh * (1 - x), 1.6, 1.6); }
        }
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = da; ctx.drawImage(off, 0, 0);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }

      // next-episode card
      const k = smooth((t - nextAt) / 1);
      if (k > 0) { ctx.fillStyle = `rgba(5,5,10,${0.55 * k})`; ctx.fillRect(0, 0, W, H); }
      text(ctx, 'NEXT EPISODE', W / 2, H * 0.42, { size: S * 0.026, weight: 600, alpha: k * 0.65, tracking: S * 0.004 });
      text(ctx, 'One Line of Algebra', W / 2, H * 0.42 + S * 0.075, { size: S * 0.07, weight: 700, alpha: k, shadow: true });
    },
  };
});
</script>
</body></html>
